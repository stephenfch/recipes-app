<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港家常菜食譜 · Resep Rumahan Hong Kong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --card-bg: #ffffff;
  --text: #2c2c2c;
  --text-secondary: #666;
  --accent: #e74c3c;
  --accent-light: #fdecea;
  --border: #eee;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-hover: 0 4px 20px rgba(0,0,0,0.15);
  --radius: 12px;
  --radius-sm: 8px;
  --cat-chicken: #ff9800;
  --cat-pork: #e91e63;
  --cat-beef: #795548;
  --cat-seafood: #03a9f4;
  --cat-vegetables: #4caf50;
  --cat-salad: #8bc34a;
  --cat-soup: #ff5722;
  --cat-porridge: #9c27b0;
  --cat-noodles: #ff9800;
  --cat-riceball: #607d8b;
  --cat-pasta: #f44336;
  --cat-egg: #ffc107;
  --cat-dessert: #e91e63;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans TC', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
  background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
  color: white;
  padding: 20px 16px 16px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 10px rgba(231,76,60,0.3);
}
.header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
.header p { font-size: 0.85rem; opacity: 0.9; }

/* Search */
.search-container {
  padding: 12px 16px 8px;
  max-width: 800px;
  margin: 0 auto;
}
.search-box {
  display: flex;
  gap: 8px;
  align-items: center;
}
.search-input {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 1rem;
  font-family: inherit;
  background: white;
  transition: border-color 0.2s;
  outline: none;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: #aaa; }
.search-count {
  font-size: 0.85rem;
  color: var(--text-secondary);
  text-align: center;
  margin-top: 6px;
}

/* Random & Add buttons */
.action-buttons {
  padding: 8px 16px 12px;
  display: flex;
  gap: 8px;
  max-width: 800px;
  margin: 0 auto;
}
.btn-random {
  flex: 1;
  padding: 14px 16px;
  background: linear-gradient(135deg, #ff6b6b, #ee5a24);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 1.1rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 2px 8px rgba(238,90,36,0.3);
}
.btn-random:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(238,90,36,0.4); }
.btn-random:active { transform: translateY(0); }
.btn-add {
  padding: 14px 20px;
  background: white;
  color: var(--accent);
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-add:hover { background: var(--accent-light); }

/* Filters */
.filters {
  padding: 0 16px 12px;
  max-width: 800px;
  margin: 0 auto;
}
.filter-section { margin-bottom: 10px; }
.filter-label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
  display: block;
}
.filter-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.filter-btn {
  padding: 6px 12px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: white;
  font-size: 0.82rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  color: var(--text);
  font-weight: 500;
}
.filter-btn:hover { border-color: #ccc; background: #f8f8f8; }
.filter-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.filter-btn .emoji { margin-right: 2px; }

/* Recipe Grid */
.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  padding: 0 16px 80px;
  max-width: 800px;
  margin: 0 auto;
}

/* Recipe Card */
.recipe-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow);
  position: relative;
}
.recipe-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
}
.card-emoji {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.8rem;
  background: linear-gradient(135deg, #fff5f5 0%, #fff 100%);
}
.card-body { padding: 10px 12px 12px; }
.card-zh {
  font-size: 0.9rem;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 2px;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-fil {
  font-size: 0.72rem;
  color: var(--text-secondary);
  line-height: 1.3;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.meta-tag {
  font-size: 0.68rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: #f0f0f0;
  color: var(--text-secondary);
  white-space: nowrap;
}
.meta-tag.cat { font-weight: 600; }
.meta-tag.cat-chicken { background: #fff3e0; color: #e65100; }
.meta-tag.cat-pork { background: #fce4ec; color: #c62828; }
.meta-tag.cat-beef { background: #efebe9; color: #4e342e; }
.meta-tag.cat-seafood { background: #e1f5fe; color: #01579b; }
.meta-tag.cat-vegetables { background: #e8f5e9; color: #1b5e20; }
.meta-tag.cat-salad { background: #f1f8e9; color: #33691e; }
.meta-tag.cat-soup { background: #fbe9e7; color: #bf360c; }
.meta-tag.cat-porridge { background: #f3e5f5; color: #4a148c; }
.meta-tag.cat-noodles { background: #fff8e1; color: #f57f17; }
.meta-tag.cat-riceball { background: #eceff1; color: #263238; }
.meta-tag.cat-pasta { background: #ffebee; color: #b71c1c; }
.meta-tag.cat-egg { background: #fffde7; color: #f57f17; }
.meta-tag.cat-dessert { background: #fce4ec; color: #ad1457; }

/* No results */
.no-results {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-secondary);
  grid-column: 1 / -1;
}
.no-results .big-emoji { font-size: 3rem; margin-bottom: 12px; }

/* Modal Overlay */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.active { display: flex; }

/* Modal */
.modal {
  background: white;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
  -webkit-overflow-scrolling: touch;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-header {
  position: sticky;
  top: 0;
  background: white;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 10;
  border-radius: 20px 20px 0 0;
}
.modal-title { flex: 1; padding-right: 12px; }
.modal-title h2 { font-size: 1.2rem; font-weight: 700; line-height: 1.3; }
.modal-title .subtitle { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
.modal-close {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: #f0f0f0;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s;
}
.modal-close:hover { background: #e0e0e0; }

.modal-emoji {
  text-align: center;
  padding: 20px;
  font-size: 4rem;
  background: linear-gradient(135deg, #fff5f5 0%, #fff 100%);
}
.modal-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 20px 16px;
}
.modal-meta .meta-tag { font-size: 0.8rem; padding: 4px 10px; }

.modal-section {
  padding: 0 20px 16px;
}
.modal-section h3 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--accent);
  display: inline-block;
}
.modal-section ul {
  list-style: none;
  padding: 0;
}
.modal-section ul li {
  padding: 6px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-section ul li:last-child { border-bottom: none; }
.modal-section ul li::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
.modal-section ol {
  padding-left: 20px;
}
.modal-section ol li {
  padding: 6px 0;
  font-size: 0.9rem;
  line-height: 1.5;
}

/* Add Recipe Modal */
.add-modal .modal {
  max-height: 95vh;
}
.form-group {
  margin-bottom: 14px;
}
.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text);
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-family: inherit;
  transition: border-color 0.2s;
  background: white;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--accent);
  outline: none;
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.btn-submit {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-submit:hover { background: #c0392b; }
.form-section {
  padding: 0 20px 20px;
}

/* Toast notification */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #333;
  color: white;
  padding: 12px 24px;
  border-radius: var(--radius);
  font-size: 0.9rem;
  z-index: 999;
  transition: transform 0.3s ease;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Scrollbar */
.modal::-webkit-scrollbar { width: 4px; }
.modal::-webkit-scrollbar-track { background: transparent; }
.modal::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

/* Responsive */
@media (min-width: 480px) {
  .recipe-grid {
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  }
}
@media (min-width: 768px) {
  .recipe-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .modal { border-radius: 20px; margin: auto; max-width: 560px; }
  .modal-overlay { align-items: center; }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .card-emoji { height: 90px; font-size: 3rem; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🍲 香港家常菜食譜</h1>
  <p>155 道家常菜 · Lutong Bahay ng Hong Kong</p>
</div>

<div class="search-container">
  <div class="search-box">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜尋食譜 / Hanapin ang resipi...">
  </div>
  <div class="search-count" id="searchCount"></div>
</div>

<div class="action-buttons">
  <button class="btn-random" onclick="randomRecipe()">🎲 今日食乜？</button>
  <button class="btn-add" onclick="openAddModal()">＋ 加食譜</button>
</div>

<div class="filters">
  <div class="filter-section">
    <span class="filter-label">份量 · Bilang ng Tao</span>
    <div class="filter-buttons" id="portionFilters">
      <button class="filter-btn active" data-portion="all" onclick="setPortion('all', this)">全部</button>
      <button class="filter-btn" data-portion="1-2" onclick="setPortion('1-2', this)">👪 1-2人</button>
      <button class="filter-btn" data-portion="3-4" onclick="setPortion('3-4', this)">👪 3-4人</button>
      <button class="filter-btn" data-portion="5+" onclick="setPortion('5+', this)">👪 5人+</button>
    </div>
  </div>
  <div class="filter-section">
    <span class="filter-label">類型 · Kategorya</span>
    <div class="filter-buttons" id="categoryFilters"></div>
  </div>
</div>

<div class="recipe-grid" id="recipeGrid"></div>

<!-- Recipe Detail Modal -->
<div class="modal-overlay" id="recipeModal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">
        <h2 id="modalTitle"></h2>
        <div class="subtitle" id="modalSubtitle"></div>
      </div>
      <button class="modal-close" onclick="closeRecipeModal()">✕</button>
    </div>
    <div class="modal-emoji" id="modalEmoji"></div>
    <div class="modal-meta" id="modalMeta"></div>
    <div class="modal-section" id="modalIngredients">
      <h3>🥬 食材 · Mga Sangkap</h3>
      <ul id="ingredientsList"></ul>
    </div>
    <div class="modal-section" id="modalSteps">
      <h3>👨‍🍳 做法 · Paraan ng Pagluluto</h3>
      <ol id="stepsList"></ol>
    </div>
  </div>
</div>

<!-- Add Recipe Modal -->
<div class="modal-overlay add-modal" id="addModal" onclick="closeAddModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">
        <h2>📝 加入新食譜 · Magdagdag ng Bagong Resipi</h2>
      </div>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="form-section">
      <div class="form-group">
        <label>中文名稱</label>
        <input type="text" id="addZh" placeholder="例：紅燒魚">
      </div>
      <div class="form-group">
        <label>Filipino Name</label>
        <input type="text" id="addFil" placeholder="例: Fried Fish in Soy Sauce">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>類型 · Kategorya</label>
          <select id="addCategory">
            <option value="chicken">🐔 雞肉 · Manok</option>
            <option value="pork">🥩 豬肉 · Baboy</option>
            <option value="beef">🐄 牛肉 · Baka</option>
            <option value="seafood">🦐 海鮮 · Pagkaing-dagat</option>
            <option value="vegetables">🥬 蔬菜 · Gulay</option>
            <option value="salad">🥗 涼拌 · Malamig na Ulam</option>
            <option value="soup">🍲 湯品 · Sabaw</option>
            <option value="porridge">🥣 粥品 · Lugaw</option>
            <option value="noodles">🍚 飯麵 · Kanin at Pansit</option>
            <option value="riceball">🍙 飯團 · Bola ng Kanin</option>
            <option value="pasta">🍝 意粉 · Pasta</option>
            <option value="egg">🍳 蛋豆腐 · Itlog at Tokwa</option>
            <option value="dessert">🍮 中式糖水 · Matamis</option>
          </select>
        </div>
        <div class="form-group">
          <label>份量 · Bilang ng Tao</label>
          <select id="addPortion">
            <option value="1-2">1-2人</option>
            <option value="3-4" selected>3-4人</option>
            <option value="5+">5人+</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>難度 · Hirap</label>
          <select id="addDifficulty">
            <option value="easy">⭐ 簡單 · Madali</option>
            <option value="medium">⭐⭐ 中等 · Katamtaman</option>
          </select>
        </div>
        <div class="form-group">
          <label>時間 · Oras</label>
          <input type="text" id="addTime" placeholder="30min">
        </div>
      </div>
      <div class="form-group">
        <label>食材 · Mga Sangkap (每行一項)</label>
        <textarea id="addIngredients" placeholder="雞腿 4隻&#10;蒜蓉 2湯匙&#10;醬油 3湯匙"></textarea>
      </div>
      <div class="form-group">
        <label>做法 · Paraan (每步一行)</label>
        <textarea id="addSteps" placeholder="雞腿洗淨切塊&#10;熱鍋下油，爆香蒜蓉&#10;加入雞腿翻炒至金黃"></textarea>
      </div>
      <button class="btn-submit" onclick="addCustomRecipe()">✅ 加入食譜 · Idagdag ang Resipi</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

  chicken:   { emoji: '🐔', zh: '雞肉', fil: 'Manok' },
  pork:      { emoji: '🥩', zh: '豬肉', fil: 'Baboy' },
  beef:      { emoji: '🐄', zh: '牛肉', fil: 'Baka' },
  seafood:   { emoji: '🦐', zh: '海鮮', fil: 'Pagkaing-dagat' },
  vegetables:{ emoji: '🥬', zh: '蔬菜', fil: 'Gulay' },
  salad:     { emoji: '🥗', zh: '涼拌', fil: 'Malamig na Ulam' },
  soup:      { emoji: '🍲', zh: '湯品', fil: 'Sabaw' },
  porridge:  { emoji: '🥣', zh: '粥品', fil: 'Lugaw' },
  noodles:   { emoji: '🍚', zh: '飯麵', fil: 'Kanin at Pansit' },
  riceball:  { emoji: '🍙', zh: '飯團', fil: 'Bola ng Kanin' },
  pasta:     { emoji: '🍝', zh: '意粉', fil: 'Pasta' },
  egg:       { emoji: '🍳', zh: '蛋豆腐', fil: 'Itlog at Tokwa' },
  dessert:   { emoji: '🍮', zh: '中式糖水', fil: 'Matamis' }
};

const FOOD_EMOJIS = {
  chicken: ['🍗','🍖','🐣','🐥'],
  pork: ['🥩','🥓','🐷'],
  beef: ['🐄','🥩','🍖'],
  seafood: ['🐟','🦐','🦀','🦑','🐚','🦪'],
  vegetables: ['🥦','🥬','🍆','🌶️','🍄','🥔','🫘','🥕'],
  salad: ['🥒','🥗','🥙'],
  soup: ['🍲','🥣'],
  porridge: ['🥣','🍚'],
  noodles: ['🍜','🍛','🍚','🌯'],
  riceball: ['🍙','🍘'],
  pasta: ['🍝','🍜'],
  egg: ['🥚','🍳','🧈'],
  dessert: ['🍮','🍮','🍋']
};

// ===== STATE =====
let currentPortion = 'all';
let currentCategory = 'all';
let currentSearch = '';
let customRecipes = [];

// Load custom recipes from localStorage
try {
  const saved = localStorage.getItem('customRecipes');
  if (saved) customRecipes = JSON.parse(saved);
} catch(e) {}

// ===== INIT =====
function init() {
  buildCategoryFilters();
  renderRecipes();
  updateCount();
}

// Build category filter buttons
function buildCategoryFilters() {
  const container = document.getElementById('categoryFilters');
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.dataset.category = 'all';
  allBtn.onclick = () => setCategory('all', allBtn);
  // Count all recipes
  const totalCount = RECIPES.length + customRecipes.length;
  allBtn.innerHTML = `全部 (${totalCount})`;
  container.appendChild(allBtn);

  const cats = ['chicken','pork','beef','seafood','vegetables','salad','soup','porridge','noodles','riceball','pasta','egg','dessert'];
  cats.forEach(cat => {
    const cfg = CAT_CONFIG[cat];
    const count = RECIPES.filter(r => r.category === cat).length +
                  customRecipes.filter(r => r.category === cat).length;
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.category = cat;
    btn.onclick = () => setCategory(cat, btn);
    btn.innerHTML = `<span class="emoji">${cfg.emoji}</span> ${cfg.zh} (${count})`;
    container.appendChild(btn);
  });
}

// Filter functions
function setPortion(portion, btn) {
  currentPortion = portion;
  document.querySelectorAll('#portionFilters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRecipes();
  updateCount();
}

function setCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('#categoryFilters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRecipes();
  updateCount();
}

// Search
document.getElementById('searchInput').addEventListener('input', function(e) {
  currentSearch = e.target.value.trim().toLowerCase();
  renderRecipes();
  updateCount();
});

function updateCount() {
  const filtered = getFilteredRecipes();
  document.getElementById('searchCount').textContent =
    `顯示 ${filtered.length} 道食譜 · Ipinapakita ang ${filtered.length} na resipi`;
}

function getFilteredRecipes() {
  const allRecipes = [...RECIPES, ...customRecipes];
  return allRecipes.filter(r => {
    if (currentPortion !== 'all' && r.portion !== currentPortion) return false;
    if (currentCategory !== 'all' && r.category !== currentCategory) return false;
    if (currentSearch) {
      const s = currentSearch;
      if (!r.zh.toLowerCase().includes(s) && !r.fil.toLowerCase().includes(s)) return false;
    }
    return true;
  });
}

// ===== RENDER =====
function renderRecipes() {
  const grid = document.getElementById('recipeGrid');
  const filtered = getFilteredRecipes();

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="no-results">
        <div class="big-emoji">🍳</div>
        <p>找不到符合的食譜<br>Walang resiping tugma</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const cfg = CAT_CONFIG[r.category] || { emoji: '🍽️', zh: r.category, fil: r.category };
    const emojis = FOOD_EMOJIS[r.category] || ['🍽️'];
    const emoji = emojis[r.id % emojis.length] || cfg.emoji;
    const diffLabel = r.difficulty === 'easy' ? '⭐ 簡單' : '⭐⭐ 中等';
    const timeLabel = r.time;

    return `
      <div class="recipe-card" onclick="openRecipeModal(${r.id}, ${r.isCustom ? true : false})">
        <div class="card-emoji">${emoji}</div>
        <div class="card-body">
          <div class="card-zh">${escHtml(r.zh)}</div>
          <div class="card-fil">${escHtml(r.fil)}</div>
          <div class="card-meta">
            <span class="meta-tag cat cat-${r.category}">${cfg.emoji} ${cfg.zh}</span>
            <span class="meta-tag">👪 ${r.portion}人</span>
            <span class="meta-tag">${diffLabel}</span>
            <span class="meta-tag">⏱️ ${timeLabel}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ===== MODAL =====
function openRecipeModal(id, isCustom) {
  const allRecipes = [...RECIPES.map(r => ({...r, isCustom: false})), ...customRecipes.map(r => ({...r, isCustom: true}))];
  const r = allRecipes.find(x => x.id === id);
  if (!r) return;

  const cfg = CAT_CONFIG[r.category] || { emoji: '🍽️', zh: r.category, fil: r.category };
  const emojis = FOOD_EMOJIS[r.category] || ['🍽️'];
  const emoji = emojis[r.id % emojis.length] || cfg.emoji;
  const diffLabel = r.difficulty === 'easy' ? '⭐ 簡單 · Madali' : '⭐⭐ 中等 · Katamtaman';

  document.getElementById('modalTitle').textContent = r.zh;
  document.getElementById('modalSubtitle').textContent = r.fil;
  document.getElementById('modalEmoji').textContent = emoji;
  document.getElementById('modalMeta').innerHTML = `
    <span class="meta-tag cat cat-${r.category}">${cfg.emoji} ${cfg.zh} · ${cfg.fil}</span>
    <span class="meta-tag">👪 ${r.portion}人份</span>
    <span class="meta-tag">${diffLabel}</span>
    <span class="meta-tag">⏱️ ${r.time}</span>
  `;

  // Ingredients
  const ingredients = r.ingredients || generateIngredients(r);
  document.getElementById('ingredientsList').innerHTML = ingredients.map(i =>
    `<li>${escHtml(i)}</li>`
  ).join('');

  // Steps
  const steps = r.steps || generateSteps(r);
  document.getElementById('stepsList').innerHTML = steps.map(s =>
    `<li>${escHtml(s)}</li>`
  ).join('');

  document.getElementById('recipeModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeRecipeModal() {
  document.getElementById('recipeModal').classList.remove('active');
  document.body.style.overflow = '';
}

function closeModal(e) {
  if (e.target === e.currentTarget) closeRecipeModal();
}

// ===== GENERATE PLACEHOLDER INGREDIENTS & STEPS =====
function generateIngredients(r) {
  const cat = r.category;
  const zh = r.zh;
  const common = ['鹽 適量','胡椒粉 少許'];

  if (cat === 'chicken') return ['雞腿/雞翼 適量','蒜蓉 2湯匙','醬油 2湯匙','紹興酒 1湯匙','糖 1茶匙','薑片 幾片', ...common];
  if (cat === 'pork') return ['豬肉/排骨 適量','蒜蓉 2湯匙','醬油 2湯匙','糖 1茶匙','紹興酒 1湯匙','蔥花 適量', ...common];
  if (cat === 'beef') return ['牛肉 適量','蒜蓉 2湯匙','醬油 2湯匙','蠔油 1湯匙','糖 1茶匙','生粉 1茶匙', ...common];
  if (cat === 'seafood') return ['鮮魚/蝦/蟹 適量','蒜蓉 2湯匙','薑片 幾片','蔥花 適量','醬油 2湯匙','紹興酒 1湯匙', ...common];
  if (cat === 'vegetables') return ['蔬菜 適量','蒜蓉 2湯匙','油 1湯匙','鹽 適量','糖 少許'];
  if (cat === 'salad') return ['主料 適量','醬油 1湯匙','醋 1茶匙','糖 1茶匙','麻油 1茶匙','蒜蓉 少許'];
  if (cat === 'soup') return ['湯料 適量','清水 適量','鹽 適量','薑片 幾片','枸杞 少許'];
  if (cat === 'porridge') return ['米 1杯','清水 8杯','瘦肉/配料 適量','薑絲 少許','蔥花 適量','鹽 適量'];
  if (cat === 'noodles') return ['麵/飯 適量','醬油 2湯匙','油 1湯匙','蒜蓉 1湯匙','蔥花 適量','配料 適量'];
  if (cat === 'riceball') return ['珍珠米 2杯','壽司醋 2湯匙','餡料 適量','海苔 適量'];
  if (cat === 'pasta') return ['意粉 200g','蒜蓉 3瓣','橄欖油 2湯匙','鹽 適量','黑胡椒 適量'];
  if (cat === 'egg') return ['雞蛋 3隻','鹽 少許','蔥花 適量','油 1湯匙'];
  if (cat === 'dessert') return ['主料 適量','冰糖 適量','清水 適量','紅棗 幾顆'];
  return ['食材 適量','調味料 適量'];
}

function generateSteps(r) {
  const cat = r.category;
  if (cat === 'soup') return [
    '將所有湯料洗淨，備用。',
    '大鍋加水，放入湯料，大火煮滾。',
    '轉小火，蓋上鍋蓋，慢煮1.5-3小時。',
    '加鹽調味，即可享用。'
  ];
  if (cat === 'porridge') return [
    '米洗淨，加少許油和鹽醃15分鐘。',
    '大鍋加水煮滾，放入米，大火煮10分鐘。',
    '轉小火，加入配料，慢煮40-60分鐘至綿滑。',
    '加鹽、蔥花、胡椒粉調味即可。'
  ];
  if (cat === 'steamed' || r.zh.includes('蒸')) return [
    '將主料洗淨，用廚紙吸乾水分。',
    '均勻塗上調味料，醃製15-20分鐘。',
    '水滾後放入蒸鍋，大火蒸15-20分鐘。',
    '灑上蔥花，淋上熱油，即可上桌。'
  ];
  if (cat === 'noodles') return [
    '麵/米洗淨，配料切好備用。',
    '熱鍋下油，爆香蒜蓉和蔥花。',
    '加入配料翻炒至熟。',
    '放入麵/飯，加醬油調味，翻炒均勻即可。'
  ];
  if (cat === 'pasta') return [
    '大鍋水加鹽煮滾，放入意粉煮至彈牙（al dente），瀝乾備用。',
    '熱鍋下橄欖油，爆香蒜蓉。',
    '加入主料翻炒至熟。',
    '放入意粉，加調味料拌勻，即可上桌。'
  ];
  if (cat === 'salad') return [
    '主料洗淨，切好備用。',
    '將醬料材料混合均勻。',
    '將主料放入大碗，淋上醬料。',
    '拌勻，冷藏30分鐘後享用更佳。'
  ];
  if (cat === 'riceball') return [
    '米煮熟，拌入壽司醋，放涼至微溫。',
    '手沾濕，取適量飯放掌心。',
    '中間放入餡料，捏成三角形。',
    '包上海苔即可。'
  ];
  if (cat === 'dessert') return [
    '主料洗淨，提前浸泡（如需要）。',
    '加水放入鍋中，大火煮滾。',
    '轉小火，加入冰糖，慢煮30-60分鐘。',
    '糖完全溶化即可享用，冷熱皆宜。'
  ];
  if (cat === 'egg') return [
    '雞蛋打散，加少許鹽和水拌勻。',
    '用濾網過篩蛋液，使其更滑嫩。',
    '蒸鍋水滾後，放入蛋液，中小火蒸8-10分鐘。',
    '取出，淋上少許醬油和麻油即可。'
  ];
  if (cat === 'seafood') return [
    '海鮮洗淨，用廚紙吸乾水分。',
    '薑切片，蒜切蓉，蔥切花。',
    '熱鍋下油，爆香薑蒜。',
    '放入海鮮，加醬油和紹興酒，翻炒或蒸煮至熟。',
    '灑上蔥花，即可上桌。'
  ];
  // Default
  return [
    '將所有材料洗淨，切好備用。',
    '熱鍋下油，爆香蒜蓉。',
    '加入主料翻炒。',
    '加調味料，翻炒均勻至熟。',
    '即可上桌享用。'
  ];
}

// ===== RANDOM RECIPE =====
function randomRecipe() {
  const filtered = getFilteredRecipes();
  if (filtered.length === 0) {
    showToast('暫無符合的食譜 · Walang resipeng tugma');
    return;
  }
  const r = filtered[Math.floor(Math.random() * filtered.length)];
  openRecipeModal(r.id, r.isCustom);
}

// ===== ADD CUSTOM RECIPE =====
function openAddModal() {
  document.getElementById('addModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeAddModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('addModal').classList.remove('active');
  document.body.style.overflow = '';
}

function addCustomRecipe() {
  const zh = document.getElementById('addZh').value.trim();
  const fil = document.getElementById('addFil').value.trim();
  const category = document.getElementById('addCategory').value;
  const portion = document.getElementById('addPortion').value;
  const difficulty = document.getElementById('addDifficulty').value;
  const time = document.getElementById('addTime').value.trim() || '30min';
  const ingredientsText = document.getElementById('addIngredients').value.trim();
  const stepsText = document.getElementById('addSteps').value.trim();

  if (!zh) { showToast('請輸入中文名稱'); return; }
  if (!fil) { showToast('請輸入 Filipino name'); return; }

  const ingredients = ingredientsText ? ingredientsText.split('\n').filter(l => l.trim()) : null;
  const steps = stepsText ? stepsText.split('\n').filter(l => l.trim()) : null;

  const newId = RECIPES.length + customRecipes.length + 1;
  const recipe = {
    id: newId,
    zh, fil, category, portion, difficulty, time,
    ingredients: ingredients,
    steps: steps,
    isCustom: true
  };

  customRecipes.push(recipe);
  try {
    localStorage.setItem('customRecipes', JSON.stringify(customRecipes));
  } catch(e) {}

  // Clear form
  document.getElementById('addZh').value = '';
  document.getElementById('addFil').value = '';
  document.getElementById('addTime').value = '';
  document.getElementById('addIngredients').value = '';
  document.getElementById('addSteps').value = '';

  closeAddModal();
  buildCategoryFilters();
  renderRecipes();
  updateCount();
  showToast('✅ 食譜已加入！· Naidagdag na ang resipi!');
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== INIT =====
init();
</script>
